name: Build for Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify app files
        run: |
          test -f package.json || { echo "::error::Falta package.json."; exit 1; }
          test -f index.html || { echo "::error::Falta index.html en la raíz del proyecto."; exit 1; }

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build for Hostinger
        run: npm run build
        env:
          VITE_BASE_PATH: /invitaciones/

      - name: Prepare Hostinger folder structure
        run: |
          set -eu
          test -f dist/index.html
          if [ -f public/.htaccess ]; then
            cp public/.htaccess dist/.htaccess
          else
            cat > dist/.htaccess <<'EOF'
          Options -MultiViews
          DirectoryIndex index.html
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /invitaciones/
            RewriteRule ^$ index.html [END]
            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [END]
            RewriteRule ^ index.html [END]
          </IfModule>
          EOF
          fi
          test -f dist/.htaccess
          mkdir -p package/invitaciones
          cp -a dist/. package/invitaciones/
          test -f package/invitaciones/index.html
          grep -q '/invitaciones/assets/' package/invitaciones/index.html
          test -d package/invitaciones/assets
          test -f package/invitaciones/api/invitations.php
          test -f package/invitaciones/api/data/.htaccess
          echo "Package ready: extract artifact into the domain's public_html root."

      - name: Upload Hostinger artifact
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-invitaciones-agency
          path: package/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
